<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth Service</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    nav a { margin-right: 12px; }
    .flash { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
    .success { background: #e8fff0; }
    .error { background: #ffecec; }
    form { display: grid; gap: 10px; max-width: 520px; }
    input, textarea { padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; }
    code { word-break: break-all; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Главная</a>
    <a href="{{ url_for('login_page') }}">Вход</a>
    <a href="{{ url_for('register_page') }}">Регистрация</a>
    <a href="{{ url_for('me_page') }}">Личный кабинет</a>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <hr />
  {% block content %}{% endblock %}
</body>
</html>
