{% extends "base.html" %}
{% block content %}
  <h1>{{ login_title }}</h1>
  <form method="post">
    <input name="username" placeholder="Логин" required />
    <input name="password" type="password" placeholder="Пароль" required />
    <button type="submit">Войти</button>
  </form>

    {% if token %}
  <h3>Успешный вход</h3>
  <p class="muted">Перенаправляем в личный кабинет…</p>
  <p><a href="{{ url_for('me_page') }}">Если не перенаправило — нажми сюда</a></p>

  <script>
    // Сохраняем токен в браузере (чтобы использовать в profile/notification сервисах)
    localStorage.setItem("jwt_token", {{ token|tojson }});
    window.location.href = "{{ url_for('me_page') }}";
  </script>
{% endif %}

{% endblock %}
