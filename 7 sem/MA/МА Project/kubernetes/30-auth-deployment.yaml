apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: user-platform-exam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "user_platform"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: LOGIN_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: LOGIN_TITLE
            - name: REGISTER_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: REGISTER_TITLE
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: WELCOME_MESSAGE
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: FLASK_SECRET_KEY
            - name: PROFILE_SERVICE_URL
              value: \"http://profile-service:5000\"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
