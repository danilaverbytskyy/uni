<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Service</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 980px; margin: 40px auto; padding: 0 16px; }
    nav a { margin-right: 12px; }
    .muted { color:#666; }
    .grid { display:grid; gap:12px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    input, textarea { padding:10px; border-radius:8px; border:1px solid #ccc; width: min(520px, 100%); }
    button { padding:10px 12px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; cursor:pointer; }
    pre { background:#f6f6f6; padding:12px; border-radius:10px; overflow:auto; }
    code { word-break: break-all; }
    .card { border:1px solid #eee; border-radius:14px; padding:14px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Profile UI</a>
    <a href="/health/live">/health/live</a>
    <a href="/health/ready">/health/ready</a>
  </nav>
  <hr />
  {% block content %}{% endblock %}
</body>
</html>
