apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  labels:
    app: debug
    env: test
spec:
  containers:
    - name: nginx-container
      image: nginx:alpine
      ports:
        - containerPort: 80

    - name: busybox-container
      image: busybox:latest
      command: ["sh", "-c", "while true; do echo $(date) >> /shared/log.txt; sleep 5; done"]
