apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: user-platform-exam
  labels:
    app.kubernetes.io/name: user-platform
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: user-platform
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
