apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: user-platform-exam
  labels:
    app.kubernetes.io/name: user-platform
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-platform
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-platform
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: YOUR_IMAGE_HERE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: LOGIN_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: LOGIN_TITLE
            - name: REGISTER_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: REGISTER_TITLE
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: ui-config
                  key: WELCOME_MESSAGE
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres:5432/user_platform"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
